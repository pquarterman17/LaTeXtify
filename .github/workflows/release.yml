name: Release kits

# On a version tag, build and test the native Windows portable app, editable
# offline repository, three platform kits, source archive, and checksums. The
# assets stay in a draft release while the exact tag is published to PyPI; the
# GitHub release becomes public only after every preceding step succeeds.

on:
  push:
    tags: ["v*"]
  # Manual re-run for an EXISTING tag whose release already exists (e.g. one
  # created directly via `gh release create`, which also fires publish.yml).
  # This path uploads the kits to that release instead of trying to create it.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build offline kits for and attach (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write # create the release and upload assets
  actions: write # dispatch and verify the trusted PyPI publishing workflow

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-portable:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
      - name: Cache Tectonic binary and package bundle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/latextify
            ~/.cache/Tectonic
          key: tectonic-${{ runner.os }}-v1
      - name: Install build dependencies
        run: |
          uv sync --locked --no-dev --extra gui --group portable
          # The hosted interpreter is runner infrastructure, not a portable
          # payload. Install a complete uv-managed runtime for the repo bundle.
          uv python install 3.13 --no-bin --no-registry
      - name: Build native Windows runtime assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run latextify make-kit --target current --python-versions 3.13 --with-gui --with-dev -o build
      - name: Freeze and verify the portable application
        env:
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
        run: |
          uv run --group portable python tools/build_windows_portable.py --kit build/latextify-offline-windows-x64 --output build/portable
          $app = Resolve-Path "build/portable/LaTeXtify-Windows-Portable/LaTeXtify.exe"
          $selfTest = Start-Process -FilePath $app -ArgumentList "--self-test" -PassThru -Wait -WindowStyle Hidden
          if ($selfTest.ExitCode -ne 0) {
            Get-Content "build/portable/LaTeXtify-Windows-Portable/latextify-startup.log" -ErrorAction SilentlyContinue
            throw "portable self-test failed (exit $($selfTest.ExitCode))"
          }
          $verify = Start-Process -FilePath $app -ArgumentList "--verify-installation" -PassThru -Wait -WindowStyle Hidden
          if ($verify.ExitCode -ne 0) { throw "portable integrity verification failed" }

      - name: Build and verify the editable offline repository
        env:
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
        run: |
          # setup-uv already installed this managed interpreter. Copying its
          # complete runtime makes the target independent of system Python.
          $python = uv python find --managed-python 3.13
          uv run --group portable python tools/build_windows_offline_repo.py `
            --kit build/latextify-offline-windows-x64 `
            --python-runtime $python `
            --output build/offline-repo
          if ($LASTEXITCODE -ne 0) { throw "offline repository build failed" }

          $repo = Resolve-Path "build/offline-repo/LaTeXtify-Windows-Offline-Repo"
          $process = Start-Process -FilePath "cmd.exe" `
            -ArgumentList "/c", "startup.bat --port 8766 --no-browser --keep-alive" `
            -WorkingDirectory $repo -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 1
              try {
                $response = Invoke-WebRequest "http://127.0.0.1:8766/" -UseBasicParsing -NoProxy
                if ($response.StatusCode -eq 200 -and $response.Content -match "LaTeXtify") {
                  $ready = $true
                  break
                }
              } catch {}
              if ($process.HasExited) { break }
            }
            if (-not $ready) {
              Get-Content "$repo/latextify-startup.log" -ErrorAction SilentlyContinue
              throw "offline repository GUI did not start"
            }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

          Push-Location $repo
          try {
            $env:LATEXTIFY_OFFLINE = "1"
            $env:PATH = "$repo/.offline-kit/tectonic;$env:PATH"
            $env:TECTONIC_CACHE_DIR = "$repo/.offline-kit/tex-bundle-cache"
            & ".venv/Scripts/python.exe" -c "import pathlib, latextify; assert pathlib.Path(latextify.__file__).resolve().is_relative_to(pathlib.Path.cwd())"
            if ($LASTEXITCODE -ne 0) { throw "offline repository did not import editable source" }
            & ".venv/Scripts/python.exe" -m pytest -q tests/test_portable.py
            if ($LASTEXITCODE -ne 0) { throw "offline repository test command failed" }
            & ".runtime/python/python.exe" "verify_installation.py"
            if ($LASTEXITCODE -ne 0) { throw "offline repository integrity verification failed" }
            & ".venv/Scripts/python.exe" -m latextify convert `
              examples/04-combined-emf/Combined-Manuscript-with-EMF.docx `
              -j revtex4-2 -o offline-repo-demo --pdf --inline-supplement `
              --columns two --inline-supplement-columns one `
              --figure-column 1=one --figure-column 2=two
            if ($LASTEXITCODE -ne 0) { throw "offline repository conversion failed" }
            if (-not (Test-Path "offline-repo-demo/revtex4-2/main.pdf")) {
              throw "offline repository did not compile a PDF"
            }
            $body = Get-Content "offline-repo-demo/revtex4-2/generated/body.tex" -Raw
            foreach ($marker in @("\begin{figure}", "\begin{figure*}", "\clearpage", "\onecolumn")) {
              if (-not $body.Contains($marker)) { throw "combined Word/EMF output is missing $marker" }
            }
          } finally {
            Pop-Location
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-offline-packages
          path: |
            build/portable/LaTeXtify-Windows-Portable.zip
            build/offline-repo/LaTeXtify-Windows-Offline-Repo.zip
          if-no-files-found: error

  build-kits:
    needs: build-windows-portable
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
      - name: Cache Tectonic binary and package bundle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/latextify
            ~/.cache/Tectonic
          key: tectonic-${{ runner.os }}-v1
      - name: Install
        run: uv sync --locked
      - name: Pre-fetch Tectonic (authenticated; anonymous API rate-limits on runners)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python -c "from latextify.compile.tectonic import ensure_tectonic; print(ensure_tectonic())"

      - name: Build native Linux kit (warms the shared, portable TeX cache)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run latextify make-kit --target linux-x64 --with-gui -o build

      # NOTE -- native-build preference: this workflow cross-builds the
      # win-x64 (and macos-arm64) kits from a single Linux runner, on a
      # GitHub-hosted-runner cost/simplicity tradeoff (one TeX warm-up pass
      # instead of three, no matrix). A NATIVE Windows kit build --
      # `latextify make-kit --target win-x64` run ON Windows, warming its own
      # TeX cache directly -- is the PREFERRED way to produce the Windows
      # kit: it exercises the real target-platform Tectonic binary end to
      # end, rather than shipping `--no-warm-tex` and trusting that a
      # Linux-warmed, source-only cache regenerates its engine format
      # correctly the first time on Windows. (The CI `offline-kit-py310-windows`
      # job partially covers this by installing+running a Windows kit, but it
      # is also `--no-warm-tex`/emit-only for speed -- it does not warm-test
      # this path either.) If a native Windows release runner ever becomes
      # available, prefer switching the win-x64 build to it over this
      # cross-build path.
      - name: Build cross Windows/macOS kits, sharing the warmed cache
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # The warmed cache ships TeX *sources* only (host-independent); the
          # target regenerates its engine format offline. So warm ONCE on Linux
          # and reuse it for the cross targets rather than re-downloading the
          # whole TeX bundle two more times.
          for tgt in win-x64 macos-arm64; do
            uv run latextify make-kit --target "$tgt" --with-gui --no-warm-tex -o build
          done
          uv run python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          build = Path("build")
          src_kit = build / "latextify-offline-linux-x64"
          src_cache = src_kit / "tex-bundle-cache"
          warmed = json.loads((src_kit / "bundle-info.json").read_text())["warmed_journals"]

          for name in ("latextify-offline-windows-x64", "latextify-offline-macos-arm64"):
              kit = build / name
              shutil.copytree(src_cache, kit / "tex-bundle-cache", dirs_exist_ok=True)
              info_path = kit / "bundle-info.json"
              info = json.loads(info_path.read_text())
              info["warm_tex"] = True
              info["warmed_journals"] = warmed
              info_path.write_text(json.dumps(info, indent=2) + "\n")
              print(f"shared warmed cache into {name} ({len(warmed)} journals)")
          PY

      - name: Package kits, source zip, and checksums
        run: |
          git archive --format=zip --prefix=latextify-src/ -o build/latextify-source.zip HEAD
          cd build
          for d in latextify-offline-*/; do
            name="${d%/}"
            zip -qr "$name.zip" "$name"
          done
          sha256sum *.zip > SHA256SUMS.txt
          echo "--- release assets ---"
          ls -lh *.zip SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-offline-packages
          path: build

      - name: Add the Windows packages to checksums
        run: |
          cd build
          # upload-artifact preserves the common `build/`-relative directory
          # structure when given files from two different subdirectories.
          # Flatten those two known assets before checksumming/uploading them.
          mv portable/LaTeXtify-Windows-Portable.zip .
          mv offline-repo/LaTeXtify-Windows-Offline-Repo.zip .
          sha256sum LaTeXtify-Windows-Portable.zip >> SHA256SUMS.txt
          sha256sum LaTeXtify-Windows-Offline-Repo.zip >> SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create draft release (if missing) and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          cd build
          assets=(
            latextify-offline-windows-x64.zip
            latextify-offline-linux-x64.zip
            latextify-offline-macos-arm64.zip
            LaTeXtify-Windows-Portable.zip
            LaTeXtify-Windows-Offline-Repo.zip
            latextify-source.zip
            SHA256SUMS.txt
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Release already exists (created directly, or by a prior run) --
            # attach/replace the kit assets without touching the release itself.
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" \
              --title "LaTeXtify $TAG" \
              --draft \
              --generate-notes \
              "${assets[@]}"
          fi

      - name: Publish the exact tag to PyPI and wait for it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          tag_sha=$(git rev-parse "$TAG^{commit}")
          previous_id=$(gh run list --workflow publish.yml --event workflow_dispatch \
            --commit "$tag_sha" --limit 1 --json databaseId \
            --jq '.[0].databaseId // empty')
          gh workflow run publish.yml --ref "$TAG" -f tag="$TAG"
          run_id=""
          for attempt in $(seq 1 30); do
            candidate=$(gh run list --workflow publish.yml --event workflow_dispatch \
              --commit "$tag_sha" --limit 1 --json databaseId \
              --jq '.[0].databaseId // empty')
            if [ -n "$candidate" ] && [ "$candidate" != "$previous_id" ]; then
              run_id="$candidate"
              break
            fi
            sleep 2
          done
          [ -n "$run_id" ] || { echo "PyPI workflow did not start" >&2; exit 1; }
          gh run watch "$run_id" --exit-status

      - name: Publish the verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release edit "$TAG" --draft=false

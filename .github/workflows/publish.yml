name: Publish to PyPI

# Publishes the sdist + wheel to PyPI. Normally dispatched by release.yml only
# after every offline artifact has built and passed its acceptance tests. The
# published-release trigger remains as a backwards-compatible/manual path.
# Neither a plain branch push nor a pull request can publish a package.
#
# ---------------------------------------------------------------------------
# OWNER SETUP REQUIRED before the first real publish (both are one-time,
# human actions on pypi.org / GitHub -- this workflow cannot do either):
#
#   1. Register a PENDING trusted publisher at
#      https://pypi.org/manage/account/publishing/ for a new project named
#      "latextify":
#        Owner:            pquarterman17
#        Repository name:  LaTeXtify
#        Workflow name:    publish.yml
#        Environment name: pypi
#      (PyPI creates the "latextify" project automatically on the first
#      successful publish from this trusted publisher -- no manual project
#      creation needed.)
#
#   2. Push a version tag (e.g. v0.1.0). release.yml builds and verifies all
#      artifacts, creates a draft GitHub release, dispatches this workflow for
#      that exact tag, and publishes the GitHub release only after PyPI passes.
# ---------------------------------------------------------------------------

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact version tag to build and publish"
        required: true
        type: string

run-name: Publish ${{ inputs.tag || github.event.release.tag_name }} to PyPI

concurrency:
  group: publish-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        # No python-version here on purpose: setup-uv reads .python-version,
        # so the repo file is the single declaration (toolchain-version rule).
      - name: Build sdist + wheel
        run: uv build
      - name: Validate distribution metadata
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/latextify/
    permissions:
      id-token: write # OIDC trusted publishing -- no API token stored in secrets
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

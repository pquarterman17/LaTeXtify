name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        # No python-version here on purpose: setup-uv reads .python-version,
        # so the repo file is the single declaration (toolchain-version rule).
      - name: Install
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      # The formatter is enforced, not merely available: before this check
      # existed, 82 of 189 files had drifted from what `ruff format` produces.
      - name: Ruff format
        run: uv run ruff format --check .
      # Strict type checking, narrow scope (see [tool.mypy] in pyproject.toml).
      # Runs before the test job so a type error fails in seconds, not minutes.
      - name: Mypy
        run: uv run mypy

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --locked
      - name: Unit tests (no TeX engine, no network)
        run: uv run pytest -q -m "not tectonic and not network"

  integration:
    # Full suite including real Tectonic compiles. One platform is enough:
    # the compile path is exercised on Windows by local development.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        # No python-version here on purpose: setup-uv reads .python-version,
        # so the repo file is the single declaration (toolchain-version rule).
      - name: Cache Tectonic binary and package bundle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/latextify
            ~/.cache/Tectonic
          key: tectonic-${{ runner.os }}-v1
      - name: Install
        run: uv sync --locked
      - name: Pre-fetch Tectonic binary
        # Test skip-guards only DETECT the binary at collection time (no
        # download), so the integration job fetches it explicitly first. The
        # download is a pinned, checksum-verified release-asset URL served by a
        # CDN (not the rate-limited releases API), so no token is needed.
        run: uv run python -c "from latextify.compile.tectonic import ensure_tectonic; print(ensure_tectonic())"
      - name: Full test suite (real docx -> PDF compiles)
        run: uv run pytest -q -m "not network"

  offline-kit:
    # Proves the whole offline story end to end: build a kit (network ON),
    # then install it and compile a PDF with the network POISONED. This is the
    # regression gate that keeps a stray runtime network call from silently
    # breaking air-gapped use. Kept small (one Python, one journal) for speed;
    # the release workflow builds the full multi-target kits.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
      - name: Cache Tectonic binary and package bundle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/latextify
            ~/.cache/Tectonic
          key: tectonic-${{ runner.os }}-v1
      - name: Install
        run: uv sync --locked
      - name: Pre-fetch Tectonic (pinned, checksum-verified release asset)
        run: uv run python -c "from latextify.compile.tectonic import ensure_tectonic; print(ensure_tectonic())"
      - name: Build a current-platform kit (network ON) and a fixture manuscript
        run: |
          uv run latextify make-kit --target current --python-versions 3.13 \
            --journals revtex4-2 -o build
          uv run python - <<'PY'
          from docx import Document
          d = Document()
          d.add_heading("Offline CI Demo", 0)
          d.add_paragraph("Ada Offline")
          d.add_heading("Abstract", 1)
          d.add_paragraph("A fixture manuscript compiled with no network access.")
          d.add_heading("Introduction", 1)
          d.add_paragraph("Body text exercising headings, an abstract, and a PDF compile.")
          d.save("demo.docx")
          PY
          echo "PYBIN=$(uv python find 3.13)" >> "$GITHUB_ENV"
      - name: Install kit + convert to PDF with the network POISONED
        env:
          # GitHub de-dupes env keys case-insensitively, so set ONE case only.
          # Uppercase is honoured by Rust/reqwest (Tectonic) and Python alike.
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
        run: |
          KIT=build/latextify-offline-linux-x64
          "$PYBIN" "$KIT/install.py"
          "$KIT/latextify" convert demo.docx -j revtex4-2 -o demo-out --pdf
          test -f demo-out/revtex4-2/main.pdf || { echo "no PDF produced offline"; exit 1; }
          echo "offline PDF compiled: $(du -h demo-out/revtex4-2/main.pdf)"

  offline-kit-py310-windows:
    name: offline kit installs on Python 3.10 (Windows)
    # Every other kit-install gate above targets the newest supported
    # interpreter (3.13) on Linux; none proves the offline kit against the
    # OLDEST supported Python (3.10, our documented floor -- see
    # requires-python in pyproject.toml) on the platform most kit users
    # actually run: Windows. A future dependency bump could silently break
    # the 3.10 floor without this catching it. This job also freezes and boots
    # the no-Python portable application while the network is poisoned.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
      - name: Install
        run: |
          uv sync --locked --group portable
          # setup-uv may select GitHub's hosted interpreter, which is not a
          # relocatable payload. Install an explicit uv-managed copy to bundle.
          uv python install 3.13 --no-bin --no-registry
      - name: Set up the TARGET Python 3.10 (what install.py will run under)
        id: py310
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Build a GUI/dev kit covering Python 3.10 and 3.13 (network ON)
        run: uv run latextify make-kit --target current --python-versions 3.10 --python-versions 3.13 --with-gui --with-dev --journals revtex4-2 --output build
      - name: Install the kit under Python 3.10, network POISONED
        env:
          # Same reasoning as the Linux offline-kit job: uppercase only, one
          # case, so GitHub's case-insensitive env-key de-dupe can't collide.
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
        run: |
          & "${{ steps.py310.outputs.python-path }}" "build/latextify-offline-windows-x64/install.py"
          if ($LASTEXITCODE -ne 0) { throw "install.py failed under Python 3.10 (exit $LASTEXITCODE)" }
          $kit = "build/latextify-offline-windows-x64"
          & "$kit/.venv/Scripts/python.exe" -c "import fastapi, uvicorn, multipart; import latextify.gui.server"
          if ($LASTEXITCODE -ne 0) { throw "offline GUI imports failed (exit $LASTEXITCODE)" }
          if (-not (Test-Path "$kit/Start-LaTeXtify-GUI.bat")) {
            throw "offline GUI launcher was not generated"
          }
      - name: Convert a fixture manuscript offline (emit-only, no --pdf)
        env:
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
        run: |
          & "build/latextify-offline-windows-x64/LaTeXtify.bat" convert tests/fixtures/clean.docx -j revtex4-2 -o demo-out
          if ($LASTEXITCODE -ne 0) { throw "convert failed under the Python 3.10 kit (exit $LASTEXITCODE)" }
          if (-not (Test-Path "demo-out/revtex4-2/main.tex")) {
            throw "Python 3.10 kit did not produce demo-out/revtex4-2/main.tex"
          }
          Write-Host "offline (Python 3.10, Windows): produced demo-out/revtex4-2/main.tex"
      - name: Build the no-install portable Windows application
        run: uv run --group portable python tools/build_windows_portable.py --kit build/latextify-offline-windows-x64 --output build/portable
      - name: Exercise the frozen application with the network poisoned
        env:
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
        run: |
          $app = Resolve-Path "build/portable/LaTeXtify-Windows-Portable/LaTeXtify.exe"
          $selfTest = Start-Process -FilePath $app -ArgumentList "--self-test" -PassThru -Wait -WindowStyle Hidden
          if ($selfTest.ExitCode -ne 0) {
            Get-Content "build/portable/LaTeXtify-Windows-Portable/latextify-startup.log" -ErrorAction SilentlyContinue
            throw "portable self-test failed (exit $($selfTest.ExitCode))"
          }
          $verify = Start-Process -FilePath $app -ArgumentList "--verify-installation" -PassThru -Wait -WindowStyle Hidden
          if ($verify.ExitCode -ne 0) { throw "portable integrity verification failed" }
          $env:LATEXTIFY_NO_BROWSER = "1"
          $env:LATEXTIFY_PORT = "8765"
          $process = Start-Process -FilePath $app -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            foreach ($attempt in 1..30) {
              Start-Sleep -Seconds 1
              try {
                $response = Invoke-WebRequest "http://127.0.0.1:8765/" -UseBasicParsing -NoProxy
                if ($response.StatusCode -eq 200 -and $response.Content -match "LaTeXtify") {
                  $ready = $true
                  break
                }
              } catch {}
              if ($process.HasExited) { break }
            }
            if (-not $ready) {
              Get-Content "build/portable/LaTeXtify-Windows-Portable/latextify-startup.log" -ErrorAction SilentlyContinue
              throw "portable GUI did not answer on loopback"
            }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Build and exercise the editable offline repository
        env:
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
        run: |
          $python = uv python find --managed-python 3.13
          uv run --group portable python tools/build_windows_offline_repo.py `
            --kit build/latextify-offline-windows-x64 `
            --python-runtime $python `
            --output build/offline-repo
          if ($LASTEXITCODE -ne 0) { throw "offline repository build failed" }
          $repo = Resolve-Path "build/offline-repo/LaTeXtify-Windows-Offline-Repo"
          & "$repo/.runtime/python/python.exe" "$repo/.offline-kit/install.py" --dir $repo
          if ($LASTEXITCODE -ne 0) { throw "offline repository setup failed" }
          Push-Location $repo
          try {
            $env:LATEXTIFY_OFFLINE = "1"
            $env:PATH = "$repo/.offline-kit/tectonic;$env:PATH"
            $env:TECTONIC_CACHE_DIR = "$repo/.offline-kit/tex-bundle-cache"
            & ".venv/Scripts/python.exe" -c "import pathlib, latextify; assert pathlib.Path(latextify.__file__).resolve().is_relative_to(pathlib.Path.cwd())"
            if ($LASTEXITCODE -ne 0) { throw "offline repository did not import editable source" }
            & ".venv/Scripts/python.exe" -m pytest -q tests/test_portable.py
            if ($LASTEXITCODE -ne 0) { throw "offline repository test command failed" }
            & ".runtime/python/python.exe" "verify_installation.py"
            if ($LASTEXITCODE -ne 0) { throw "offline repository integrity verification failed" }
            & ".venv/Scripts/python.exe" -m latextify convert `
              examples/04-combined-emf/Combined-Manuscript-with-EMF.docx `
              -j revtex4-2 -o offline-repo-demo --pdf --inline-supplement `
              --columns two --inline-supplement-columns one `
              --figure-column 1=one --figure-column 2=two
            if ($LASTEXITCODE -ne 0) { throw "combined Word/EMF scenario failed" }
            $body = Get-Content "offline-repo-demo/revtex4-2/generated/body.tex" -Raw
            foreach ($marker in @("\begin{figure}", "\begin{figure*}", "\clearpage", "\onecolumn")) {
              if (-not $body.Contains($marker)) { throw "combined Word/EMF output is missing $marker" }
            }
          } finally {
            Pop-Location
          }
